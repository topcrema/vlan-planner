<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 1320px; height: 2868px; overflow: hidden;
    background: linear-gradient(160deg, #0F172A 0%, #16275E 55%, #1E3A8A 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .headline {
    padding: 96px 80px 0; text-align: center; color: #FFFFFF;
    font-size: 92px; font-weight: 700; line-height: 1.14; letter-spacing: -1.5px;
    white-space: pre-line;
  }
  .sub {
    margin-top: 26px; text-align: center; color: #93C5FD;
    font-size: 44px; font-weight: 500;
  }
  .device {
    margin: 64px auto 0; width: 1080px; border-radius: 64px; overflow: hidden;
    box-shadow: 0 44px 130px rgba(0, 0, 0, 0.6);
    border: 6px solid rgba(255, 255, 255, 0.14);
    background: #F8FAFF;
  }
  .device img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="headline" id="headline"></div>
  <div class="sub" id="sub"></div>
  <div class="device"><img id="shot" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('headline').textContent = (q.get('title') || '').replace(/\\n/g, '\n');
    document.getElementById('sub').textContent = q.get('sub') || '';
    document.getElementById('shot').src = q.get('img') || '';
  </script>
</body>
</html>
